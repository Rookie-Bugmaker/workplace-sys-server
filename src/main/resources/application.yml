server:
  # 端口
  port: 11501
  # 增加请求头大小
  max-http-header-size: 10485760
  tomcat:
    uri-encoding: UTF-8
    #最大链接数
    max-connections: 10000
    #最大等待队列长度
    accept-count: 500
    threads:
      #最小线程数
      min-spare: 50
      #最大的线程数
      max: 400
spring:
  profiles:
    active: @env@
  application:
    name: sys-server
  main:
    allow-bean-definition-overriding: true
  mvc:
    format:
      date: yyyy-MM-dd
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  config:
    import:
      - optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        server-addr: @nacos.config.serverAddr@
        file-extension: @nacos.config.fileExtension@
        namespace: @nacos.config.namespace@
        username: @nacos.username@
        password: @nacos.password@
      discovery:
        server-addr: @nacos.discovery.server@
        namespace: @nacos.discovery.namespace@
        username: @nacos.username@
        password: @nacos.password@
        ip: @nacos.discovery.ip@
  redis:
    type: @spring.redis.type@ # 当前使用的redis类型(单机/哨兵)
    database: @spring.redis.database@ # Redis数据库索引（默认为0）
    host: @spring.redis.host@
    port: @spring.redis.port@
    password: @spring.redis.password@ # Redis服务器连接密码（默认为空）
    timeout: 10000ms # 连接超时时间（毫秒）默认是2000ms
    lettuce:
      pool:
        max-active: -1 # 连接池最大连接数（使用负值表示没有限制）
        max-idle: 500 # 连接池中的最大空闲连接
        max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
        min-idle: 200 # 连接池中的最小空闲连接
    sentinel:
      master: @spring.redis.sentinel.master@
      nodes: @spring.redis.sentinel.nodes@
      password: @spring.redis.sentinel.password@
mybatis:
  #实体扫描
  type-aliases-package: com.cccr.sys.entity
  #指向mapper的xml文件位置
  mapper-locations: classpath:mapper/**/*.xml
  #mybatis配置
  configLocation: classpath:mybatis-spring.xml
pagehelper:
  offsetAsPageNum: true
  rowBoundsWithCount: true
  reasonable: true
  #通过设置pageSize=0或RowBounds.limit=0就会查询出全部的结果。
  pageSizeZero: true
mybatis-plus:
  #实体扫描
  type-aliases-package: com.cccr.sys.entity
  #指向mapper的xml文件位置
  mapper-locations: classpath:mapper/**/*.xml
  # 对应之前使用mybatis中mybatis-spring.xml中的配置
  configuration:
    call-setters-on-nulls: true
    cache-enabled: false
    local-cache-scope: statement  # 分布式项目,将默认的一级缓存的SQL_SESSION调整为STATEMENT级别
    jdbc-type-for-null: 'null'
feign:
  client:
    config:
      default:
        # openFeign日志：NONE、BASIC、HEADERS、FULL
        logger-level: BASIC
        # 连接超时时间(ms)，默认2s
        connect-timeout: 60000
        # 请求处理超时时间(ms)，默认5s
        read-timeout: 60000
  sentinel:
    enabled: true
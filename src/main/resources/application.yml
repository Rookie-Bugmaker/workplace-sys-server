# ======================== 六翼天使监控 - JVM性能指标(Metrics)接入 ========================
# 参考文档: docs/六翼天使监控接入手册.docx 第4.1节
# 作用: 通过Spring Boot Actuator暴露Prometheus格式的JVM指标, 供Prometheus拉取后转发至六翼天使平台
management:
  # --- 指标导出配置: 启用Prometheus指标导出 ---
  metrics:
    export:
      prometheus:
        enabled: true          # 启用Prometheus指标导出，Prometheus可通过/prometheus端点拉取JVM指标
    tags:
      monitor-type: jvm        # 自定义标签，标识指标类型为JVM，便于六翼天使平台分类筛选
  # --- 端点暴露配置: 控制哪些Actuator端点对外可见 ---
  endpoints:
    enabled-by-default: true   # 开启所有监控端点
    web:
      exposure:
        include: ["prometheus", "health"]  # 暴露prometheus监控端点和health健康检查端点
      base-path: /              # 设置端点基础路径为/，使Prometheus端点地址为 /prometheus（而非默认的 /actuator/prometheus）
  # --- 各端点启用配置 ---
  endpoint:
    health:
      show-details: always
      enabled: true             # 启用健康检查端点 /health，供K8s或DevCube健康探测使用
    info:
      enabled: true             # 启用信息端点 /info
    metrics:
      enabled: true             # 启用metrics端点，提供指标数据查询能力
    prometheus:
      enabled: true             # 启用prometheus端点，输出Prometheus格式的指标数据


# ======================== 日志级别配置 ========================
# 只打印业务日志：请求入口 + SQL语句，框架/中间件保持INFO不打扰
logging:
  level:
    com.crrc.sys: DEBUG          # 业务代码（Controller/Service）
    com.crrc.sys.mapper: DEBUG   # MyBatis SQL语句+参数+返回行数

server:
  # 端口
  port: 11501
  # 增加请求头大小
  max-http-header-size: 10485760
  tomcat:
    uri-encoding: UTF-8
    #最大链接数
    max-connections: 10000
    #最大等待队列长度
    accept-count: 500
    threads:
      #最小线程数
      min-spare: 50
      #最大的线程数
      max: 400
    # --- 六翼天使监控: 启用Tomcat MBean注册，使JMX能采集到Tomcat连接池/线程池等指标 ---
    mbeanregistry:
      enabled: true
spring:
  profiles:
    active: @env@
  application:
    name: sys-server
  main:
    allow-bean-definition-overriding: true
  mvc:
    format:
      date: yyyy-MM-dd
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  redis:
    type: @spring.redis.type@ # 当前使用的redis类型(单机/哨兵)
    database: @spring.redis.database@ # Redis数据库索引（默认为0）
    host: @spring.redis.host@
    port: @spring.redis.port@
    password: @spring.redis.password@ # Redis服务器连接密码（默认为空）
    timeout: 10000ms # 连接超时时间（毫秒）默认是2000ms
    lettuce:
      pool:
        max-active: -1 # 连接池最大连接数（使用负值表示没有限制）
        max-idle: 500 # 连接池中的最大空闲连接
        max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
        min-idle: 200 # 连接池中的最小空闲连接
    sentinel:
      master: @spring.redis.sentinel.master@
      nodes: @spring.redis.sentinel.nodes@
      password: @spring.redis.sentinel.password@
  data:
    mongodb:
      host: @spring.data.mongodb.host@
      port: @spring.data.mongodb.port@
      database: @spring.data.mongodb.database@
      username: @spring.data.mongodb.username@
      password: @spring.data.mongodb.password@
      authentication-database: @spring.data.mongodb.authenticationDatabase@ # 验证数据库，一般不修改
      connectTimeoutMS: @spring.data.mongodb.connectTimeoutMS@ # 等待连接最大超时时间
mybatis:
  #实体扫描
  type-aliases-package: com.crrc.sys.entity
  #指向mapper的xml文件位置
  mapper-locations: classpath:mapper/**/*.xml
  #mybatis配置
  configLocation: classpath:mybatis-spring.xml
pagehelper:
  offsetAsPageNum: true
  rowBoundsWithCount: true
  reasonable: true
  #通过设置pageSize=0或RowBounds.limit=0就会查询出全部的结果。
  pageSizeZero: true
mybatis-plus:
  #实体扫描
  type-aliases-package: com.crrc.sys.entity
  #指向mapper的xml文件位置
  mapper-locations: classpath:mapper/**/*.xml
  # 对应之前使用mybatis中mybatis-spring.xml中的配置
  configuration:
    call-setters-on-nulls: true
    cache-enabled: false
    local-cache-scope: statement  # 分布式项目,将默认的一级缓存的SQL_SESSION调整为STATEMENT级别
    jdbc-type-for-null: 'null'
feign:
  client:
    config:
      default:
        # openFeign日志：NONE、BASIC、HEADERS、FULL
        logger-level: BASIC
        # 连接超时时间(ms)，默认2s
        connect-timeout: 60000
        # 请求处理超时时间(ms)，默认5s
        read-timeout: 60000
  sentinel:
    enabled: true
crrc:
  service:
    name: sys-server
    sys_name: sys
    sys_service: true
  datasource:
    decrypt:
      type: ENC(a3Isg7qyzfgyXtPsK8lFc5gM0+8V1jP3lOS81cqQyEjOwLYdJVNJz18jFwmbKxSM)
      key: ENC(JQvAm8Fd0O38cxQauAm3GSbd43+f5F1HBNgArMFchgYnO0OCgdvIm9qF+3XxkpTSce2ijisO7kEMCmPLzMYk23SHGRB6h415LDWPzkkwkGc=)


springdoc:
  swagger-ui:
    # url: /${spring.application.name}/v3/api-docs
    url: /v3/api-docs
knife4j:
  enable: true

# 服务地址配置（从 filters 配置文件读取）
service:
  address:
    skywalking: @skywalking.url@
    kibana: @kibana.url@
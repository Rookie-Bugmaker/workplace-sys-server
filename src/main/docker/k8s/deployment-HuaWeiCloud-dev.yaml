kind: Deployment
apiVersion: apps/v1
metadata:
  name: workplace-sys-server
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workplace-sys-server
      version: v1
  template:
    metadata:
      labels:
        app: workplace-sys-server
        version: v1
    spec:
      containers:
        - name: container-workplace-sys-server
          image: swr.ckgf-global-1.cccar.com.cn/work_place/workplace-sys-server-test:5.0.0
          resources:
            limits:
              cpu: '4'
              memory: 4Gi
            requests:
              cpu: '2'
              memory: 2Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600


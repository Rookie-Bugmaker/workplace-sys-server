kind: Deployment
apiVersion: apps/v1
metadata:
  name: workplace-sys-server
  namespace: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workplace-sys-server
      version: v1
  template:
    metadata:
      labels:
        app: workplace-sys-server
        version: v1
    spec:
      volumes:
        - name: vol-workplace-sys-server-config
          configMap:
            name: workplace-sys-server-config
            defaultMode: 420
      containers:
        - name: container-workplace-sys-server
          image: swr.ckgf-global-1.cccar.com.cn/work_place/workplace-sys-server-product:5.0.0
          resources:
            limits:
              cpu: '4'
              memory: 4Gi
            requests:
              cpu: '2'
              memory: 2Gi
          volumeMounts:
            - name: vol-workplace-sys-server-config
              readOnly: true
              mountPath: /home/workplace/application.yml
              subPath: application-enc.yml
            - name: vol-workplace-sys-server-config
              readOnly: true
              mountPath: /home/workplace/bootstrap.yml
              subPath: bootstrap-enc.yml
          livenessProbe:
            tcpSocket:
              port: 11501
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 11501
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - '-c'
                  - sleep 60 && curl -X GET http://127.0.0.1:11501/deregister
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          env:
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: workplace-sys-server-enc-secret
                  key: ENCRYPT_KEY
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: default-secret
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

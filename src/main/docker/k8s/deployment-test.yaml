apiVersion: apps/v1
kind: Deployment
metadata:
  name: @project.artifactId@
  namespace: @k8s.namespace@
spec:
  replicas: 1
  selector:
    matchLabels:
      app: @project.artifactId@
  template:
    metadata:
      labels:
        app: @project.artifactId@
    spec:
      containers:
        - name: @project.artifactId@
          image: $REGISTRY/$DOCKERHUB_NAMESPACE/$APP_NAME:$APP_VERSION-$PROFILE-$MY_BUILD_NUMBER
          resources:
            limits:
              memory: "2Gi"
          livenessProbe:
            tcpSocket:
              port: 11501
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 11501
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: [ "/bin/sh", "-c", "sleep 60 && curl -X GET http://127.0.0.1:11501/deregister" ]
          imagePullPolicy: Always
          env:
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: workplace-sys-server-enc-secret
                  key: ENCRYPT_KEY
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: harbor-login-registry
      hostAliases:
        - ip: 10.216.244.161
          hostnames:
            - "aistart.cccar.com.cn"
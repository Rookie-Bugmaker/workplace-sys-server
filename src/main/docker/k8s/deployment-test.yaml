apiVersion: apps/v1
kind: Deployment
metadata:
  name: @project.artifactId@
  namespace: @k8s.namespace@
spec:
  replicas: 1
  selector:
    matchLabels:
      app: @project.artifactId@
  template:
    metadata:
      labels:
        app: @project.artifactId@
    spec:
      containers:
        - name: @project.artifactId@
          image: $REGISTRY/$DOCKERHUB_NAMESPACE/$APP_NAME:$APP_VERSION-$PROFILE-$MY_BUILD_NUMBER
          resources:
            limits:
              memory: "2Gi"
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: [ "/bin/sh", "-c", "sleep 60 && curl -X GET http://127.0.0.1:11501/deregister" ]
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: harbor-login-registry
      hostAliases:
        - ip: 10.216.244.161
          hostnames:
            - "aistart.cccar.com.cn"
        - ip: 10.216.0.98
          hostnames:
            - "qywx.cccar.com.cn"